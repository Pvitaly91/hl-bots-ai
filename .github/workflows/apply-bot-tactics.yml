name: Apply bot tactics patch

on:
  push:
    branches:
      - main
      - feature/bot-tactics-pickups

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        run: python3 scripts/apply_bot_tactics_patch.py
      - name: Build focused tests
        run: make -C tests test_bot test_bot_combat
      - name: Run focused tests
        run: |
          ./tests/test_bot
          ./tests/test_bot_combat
      - name: Remove one-shot automation
        run: |
          rm scripts/apply_bot_tactics_patch.py
          rm .github/workflows/apply-bot-tactics.yml
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.cpp bot_combat.cpp bot_weapons.cpp scripts/apply_bot_tactics_patch.py .github/workflows/apply-bot-tactics.yml
          git commit -m "Improve bot close combat and pickup tactics"
          git push origin HEAD:${GITHUB_REF_NAME}
